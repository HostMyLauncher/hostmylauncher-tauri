[package]
name = "webview-validation"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
hostmylauncher-tauri = { path = "../../crates/hostmylauncher-tauri", features = ["plugin"] }
hostmylauncher = { path = "../../../hostmylauncher-rs" }
tauri = { version = "2", features = ["wry"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
wiremock = "0.6"

[build-dependencies]
tauri-build = "2"
